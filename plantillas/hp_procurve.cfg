! Configuracion base para switches HP ProCurve
! Reset a estado inicial para practicas de redes

hostname {hostname}

vlan {mgmt_vlan}
 name Management
 ip address {mgmt_ip} {subnet_mask}
 untagged all

ip default-gateway {default_gateway}

console linear
exec-timeout 0

password manager {enable_password}
password operator {password}

write memory
