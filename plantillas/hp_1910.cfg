! Configuracion base para switches HP 1910 (Comware-based)
! Reset a estado inicial para practicas de redes

sysname {hostname}

vlan {mgmt_vlan}
quit

interface vlan-interface {mgmt_vlan}
 ip address {mgmt_ip} {subnet_mask}
 quit

ip route-static 0.0.0.0 0.0.0.0 {default_gateway}

local-user admin
 password simple {enable_password}
 authorization-attribute level 3
 quit

user-interface console 0
 authentication-mode password
 set authentication password simple {password}
 quit
