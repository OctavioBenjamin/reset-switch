! Configuracion base para switches Cisco IOS
! Reset a estado inicial para practicas de redes

hostname {hostname}
no ip domain-lookup

interface Vlan{mgmt_vlan}
 ip address {mgmt_ip} {subnet_mask}
 no shutdown

ip default-gateway {default_gateway}

line console 0
 logging synchronous
 exec-timeout 0 0

line vty 0 15
 logging synchronous
 exec-timeout 0 0
 transport input ssh telnet

username {username} privilege 15 password 0 {password}
enable password 0 {enable_password}

end
